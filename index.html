<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego del Cazado</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>
</head>
<body>
  <div class="contenedor">
    <label>Introduzca la palabra a buscar:</label>
    <input type="password" id="palabraAbuscar">
    <button id="bMostrar1">Mostrar palabra</button>
    <br><br><br>
    <button id="bEmpezar">Empezar a jugar</button>
    <br><br><br>
    <p id="palabraCensurada"></p>
    <h1 id="intentos"></h1>
    <h3 id="letrasFallidas"></h3>
    <h1 id="cuentaAtras"></h1>
    <br><br><br>
    <label>Escribe una letra: </label>
    <input type="text" id="letraUsuario" maxlength="1" disabled>
    <button id="bAceptar" disabled>Aceptar</button>
    <p id="resultado"></p>
  </div>
</body>

</html>
